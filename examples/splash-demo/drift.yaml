app:
  name: SplashDemo
  id: com.example.driftsplashdemo
  orientation: portrait

plugins:
  # Supported on iOS (Xcode 16+), xtool and Android. See
  # plugins/splash/plugin/plugin.go for every option.
  - package: github.com/go-drift/drift/plugins/splash/plugin
    config:
      image: assets/splash.png
      background_color: "#FFFFFF"
      fade_duration_ms: 200
