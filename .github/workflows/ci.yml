name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Plugin modules
        run: |
          for mod in plugins/*/; do
            echo "::group::$mod"
            (cd "$mod" && go vet ./... && go test ./...) || exit 1
            echo "::endgroup::"
          done
